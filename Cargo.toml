[package]
name        = "irak_notes"
version     = "0.1.0"
edition     = "2021"
description = "Irak Notes – a feature-rich auto-saving notepad (Rust/egui port)"

[[bin]]
name = "irak_notes"
path = "src/main.rs"

[dependencies]
eframe          = { version = "0.27", default-features = false, features = ["default_fonts", "glow"] }
egui            = "0.27"
egui_extras     = "0.27"
glow            = "0.13"
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
dirs            = "5"          # replaces os.path.expanduser("~")
chrono          = "0.4"        # timestamps / file naming
open            = "5"          # replaces os.startfile / subprocess open
rfd             = "0.14"       # native file dialogs (colour picker lives here too)
once_cell       = "1"          # lazy statics

[profile.release]
opt-level = 3
lto       = true
strip     = true
